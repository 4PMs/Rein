<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Tempera Benchmark v1 latest pilot status</title>
  <desc id="desc">Latest benchmark-v1 stage 12.6 live5 artifact status: four validation runs completed, zero actual agent episodes, zero valid off-on pairs.</desc>
  <rect width="1200" height="620" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Tempera Benchmark v1 · Latest pilot status</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Stage 12.6 · runs-stage126-live5 · validation-only artifact</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="160" width="250" height="150" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="185" y="205" text-anchor="middle" fill="#bfdbfe" font-size="20">Planned arms</text>
    <text x="185" y="265" text-anchor="middle" fill="#f8fafc" font-size="52" font-weight="700">4</text>
    <text x="185" y="292" text-anchor="middle" fill="#cbd5e1" font-size="16">2 OFF/ON pairs</text>

    <rect x="350" y="160" width="250" height="150" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
    <text x="475" y="205" text-anchor="middle" fill="#a7f3d0" font-size="20">Artifacts completed</text>
    <text x="475" y="265" text-anchor="middle" fill="#f8fafc" font-size="52" font-weight="700">4</text>
    <text x="475" y="292" text-anchor="middle" fill="#cbd5e1" font-size="16">container runtime smoke</text>

    <rect x="640" y="160" width="250" height="150" rx="16" fill="#451a03" stroke="#fb923c" stroke-width="3"/>
    <text x="765" y="205" text-anchor="middle" fill="#fed7aa" font-size="20">Agent episodes</text>
    <text x="765" y="265" text-anchor="middle" fill="#f8fafc" font-size="52" font-weight="700">0</text>
    <text x="765" y="292" text-anchor="middle" fill="#cbd5e1" font-size="16">not executed</text>

    <rect x="930" y="160" width="210" height="150" rx="16" fill="#450a0a" stroke="#f87171" stroke-width="3"/>
    <text x="1035" y="205" text-anchor="middle" fill="#fecaca" font-size="20">Valid pairs</text>
    <text x="1035" y="265" text-anchor="middle" fill="#f8fafc" font-size="52" font-weight="700">0</text>
    <text x="1035" y="292" text-anchor="middle" fill="#cbd5e1" font-size="16">no empirical comparison</text>
  </g>

  <path d="M310 235 H350 M600 235 H640 M890 235 H930" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>

  <rect x="60" y="370" width="1080" height="150" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="415" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Interpretation</text>
  <text x="90" y="455" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">The latest artifact verifies wiring, observers, manifests, and lifecycle capture.</text>
  <text x="90" y="488" fill="#fbbf24" font-family="Arial, sans-serif" font-size="19" font-weight="700">It must not be used to claim model capability, compliance, or guardrail effectiveness.</text>
</svg>
